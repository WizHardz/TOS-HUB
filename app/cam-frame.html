<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WizHardz Cam Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Cinzel+Decorative:wght@700&family=Press+Start+2P&family=Rubik:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  /* A frame + effects layer that sits exactly over your webcam in OBS. Settings come from the
     address (?style=neon&c1=...) which TOS HUB fills in for you. */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{--c1:#2ff3ff;--c2:#b14dff;--t:8px;--r:18px;--glow:18px;--ts:1;color:#fff}
  #root{position:absolute;inset:0}
  #camcv,#bgcv,#fxb{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  #frame{position:absolute;inset:0;pointer-events:none;z-index:2;box-sizing:border-box}

  /* ---- styles ---- */
  .neon #frame{border:var(--t) solid var(--c1);border-radius:var(--r);
    box-shadow:inset 0 0 0 3px var(--c2), inset 0 0 var(--glow) color-mix(in srgb, var(--c1) 75%, transparent)}
  .neon.pulse #frame{animation:neonPulse 2.6s ease-in-out infinite}
  @keyframes neonPulse{50%{box-shadow:inset 0 0 0 3px var(--c2), inset 0 0 calc(var(--glow) * 2) color-mix(in srgb, var(--c1) 95%, transparent)}}

  .pixel #frame{border:var(--t) solid var(--c1);border-radius:0;
    box-shadow:inset 0 0 0 calc(var(--t) * .5) #000, inset 0 0 0 var(--t) var(--c2);
    clip-path:polygon(var(--t) 0, calc(100% - var(--t)) 0, calc(100% - var(--t)) var(--t), 100% var(--t), 100% calc(100% - var(--t)),
      calc(100% - var(--t)) calc(100% - var(--t)), calc(100% - var(--t)) 100%, var(--t) 100%, var(--t) calc(100% - var(--t)),
      0 calc(100% - var(--t)), 0 var(--t), var(--t) var(--t))}
  .pixel.pulse #frame{animation:pixPulse 1.2s steps(2) infinite}
  @keyframes pixPulse{50%{border-color:var(--c2);box-shadow:inset 0 0 0 calc(var(--t) * .5) #000, inset 0 0 0 var(--t) var(--c1)}}

  .clean #frame{border:var(--t) solid var(--c1);border-radius:var(--r);box-shadow:inset 0 0 calc(var(--glow) * .6) rgba(0,0,0,.45)}
  .clean.pulse #frame{animation:cleanPulse 3s ease-in-out infinite}
  @keyframes cleanPulse{50%{border-color:color-mix(in srgb, var(--c1) 70%, #fff)}}

  /* cam shape: the frame follows the webcam's rounded / circle mask */
  .shape-round.pixel #frame{border-radius:var(--r);clip-path:none}
  .shape-circle #frame{border-radius:50% !important;clip-path:none}
  .shape-circle .rune{display:none}
  .shape-circle #tag:not(.none){left:50% !important;right:auto !important;top:auto !important;bottom:calc(var(--t) * 2.4) !important;transform:translateX(-50%)}
  .shape-circle #by{right:auto;left:50%;transform:translateX(-50%);top:calc(var(--t) * 2.4)}

  /* more cam shapes (hexagon, gem, shield, heart, arch) are drawn as an SVG outline */
  #shapeSvg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none;overflow:visible}
  #shOuter{fill:none;stroke:var(--c1);stroke-linejoin:round;filter:drop-shadow(0 0 calc(var(--glow) / 2) var(--c1))}
  #shInner{fill:none;stroke:var(--c2);stroke-width:3;stroke-linejoin:round}
  .pixel #shOuter,.pixel #shInner{stroke-linejoin:miter;filter:none}
  .clean #shOuter{filter:none} .clean #shInner{display:none}
  .neon.pulse #shOuter{animation:svgPulse 2.6s ease-in-out infinite}
  @keyframes svgPulse{50%{filter:drop-shadow(0 0 var(--glow) var(--c1)) drop-shadow(0 0 4px #fff)}}
  .svgshape #frame{border:0 !important;box-shadow:none !important;clip-path:none}
  .svgshape #frame.flash{animation:none !important}
  .svgshape .rune{display:none}
  .svgshape #by{right:auto;left:50%;transform:translateX(-50%);top:18%}
  .shape-hex #tag:not(.none),.shape-gem #tag:not(.none),.shape-shield #tag:not(.none),.shape-heart #tag:not(.none){left:50% !important;right:auto !important;top:auto !important;transform:translateX(-50%)}
  .shape-hex #tag:not(.none){bottom:calc(var(--t) * 2) !important}
  .shape-gem #tag:not(.none){bottom:26% !important}
  .shape-shield #tag:not(.none){bottom:24% !important}
  .shape-heart #tag:not(.none){bottom:30% !important}
  .shape-arch #tag.tl{top:auto;bottom:calc(var(--t) * 1.6)} .shape-arch #tag.tr{top:auto;bottom:calc(var(--t) * 1.6)}

  /* ---- more frame styles ---- */
  @property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
  .rainbow #frame,.arcane #frame{border-radius:var(--r)}
  .rainbow #frame::before,.arcane #frame::before{content:"";position:absolute;inset:0;padding:var(--t);border-radius:inherit;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .rainbow #frame{box-shadow:inset 0 0 var(--glow) rgba(255,255,255,.22)}
  .rainbow #frame::before{background:conic-gradient(from var(--spin),#ff3b3b,#ffb02e,#ffe14d,#3dff8a,#2ff3ff,#6f8bff,#b14dff,#ff4fd8,#ff3b3b);animation:spinGrad 4s linear infinite}
  .rainbow:not(.pulse) #frame::before{animation-duration:14s}
  @keyframes spinGrad{to{--spin:360deg}}
  .arcane #frame{box-shadow:inset 0 0 0 calc(var(--t) + 3px) var(--c2), inset 0 0 calc(var(--glow) * 1.4) rgba(255,200,80,.45)}
  .arcane #frame::before{background:linear-gradient(135deg,#fff4c2,#d9a521 22%,#7a4d06 45%,#ffe08a 62%,#a8740a 82%,#fff4c2);background-size:300% 300%}
  .arcane.pulse #frame::before{animation:goldShine 5s ease-in-out infinite}
  @keyframes goldShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .glitch #frame{border:var(--t) solid var(--c1);border-radius:var(--r);box-shadow:inset 0 0 var(--glow) color-mix(in srgb, var(--c1) 55%, transparent)}
  .glitch #frame::before,.glitch #frame::after{content:"";position:absolute;inset:calc(var(--t) * -1);border:var(--t) solid;border-radius:inherit;mix-blend-mode:screen;opacity:.85}
  .glitch #frame::before{border-color:#ff2a6d;transform:translate(-2px,0)}
  .glitch #frame::after{border-color:#05d9e8;transform:translate(2px,0)}
  .glitch.pulse #frame::before{animation:glitchA 2.4s steps(1) infinite}
  .glitch.pulse #frame::after{animation:glitchB 2.4s steps(1) infinite}
  @keyframes glitchA{0%,100%{transform:translate(-2px,0);clip-path:inset(0)}8%{transform:translate(-7px,3px);clip-path:inset(10% 0 60% 0)}12%{transform:translate(5px,-2px);clip-path:inset(55% 0 20% 0)}16%{transform:translate(-2px,0);clip-path:inset(0)}
    52%{transform:translate(8px,0);clip-path:inset(30% 0 40% 0)}55%{transform:translate(-2px,0);clip-path:inset(0)}}
  @keyframes glitchB{0%,100%{transform:translate(2px,0);clip-path:inset(0)}9%{transform:translate(6px,-3px);clip-path:inset(62% 0 8% 0)}13%{transform:translate(-5px,2px);clip-path:inset(18% 0 58% 0)}17%{transform:translate(2px,0);clip-path:inset(0)}
    53%{transform:translate(-8px,1px);clip-path:inset(45% 0 25% 0)}56%{transform:translate(2px,0);clip-path:inset(0)}}
  .comic #frame{border:var(--t) solid var(--c1);border-radius:var(--r);box-shadow:inset 0 0 0 4px #000}
  .comic #frame::before{content:"";position:absolute;inset:calc(var(--t) * -1);border:4px solid #000;border-radius:inherit}
  .comic #frame::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.55;
    background:radial-gradient(circle,#000 1.3px,transparent 1.8px) 0 0/10px 10px;
    -webkit-mask:radial-gradient(ellipse at 0 0,#000 0,transparent 24%),radial-gradient(ellipse at 100% 100%,#000 0,transparent 24%)}
  .comic.pulse #frame{animation:comicPulse 1.6s steps(1) infinite}
  @keyframes comicPulse{50%{border-color:var(--c2)}}
  .none #frame,.none .rune,.none #shapeSvg{display:none !important}
  .svgshape #frame::before,.svgshape #frame::after{display:none}
  /* name tags for the new styles */
  .arcane #tag{background:linear-gradient(#24103e,#140826);border:3px solid #d9a521;box-shadow:0 0 0 2px #000, 0 0 16px rgba(255,200,80,.45);border-radius:6px}
  .arcane #tag .n{font:700 calc(22px * var(--ts))/1.15 "Cinzel Decorative", serif;color:#ffe08a;text-shadow:0 2px 0 #000}
  .arcane #tag .s{font:600 calc(15px * var(--ts))/1.3 Rubik, sans-serif;color:#e8d3ff}
  .glitch #tag{border-color:var(--c1);box-shadow:-3px 0 0 #ff2a6d, 3px 0 0 #05d9e8;border-radius:2px}
  .glitch #tag .n{font:calc(26px * var(--ts))/1 VT323, monospace;letter-spacing:1px;text-shadow:-2px 0 #ff2a6d, 2px 0 #05d9e8}
  .comic #tag{background:#fff;border:3px solid #000;box-shadow:5px 5px 0 #000;border-radius:14px}
  .comic #tag .n{font:calc(28px * var(--ts))/1 Bangers, Impact, sans-serif;letter-spacing:1px;color:#000;text-shadow:2px 2px 0 var(--c1)}
  .comic #tag .s{font:700 calc(15px * var(--ts))/1.2 Rubik, sans-serif;color:#000}
  .rainbow #tag{border-color:#fff;box-shadow:4px 4px 0 #ff4fd8, 8px 8px 0 #2ff3ff}
  .comic #banner .b1{font-family:Bangers, Impact, sans-serif;letter-spacing:2px}
  .arcane #banner .b1{font-family:"Cinzel Decorative", serif;color:#ffe08a}
  /* svg shape outlines for the new styles */
  #shBlack,#shG1,#shG2{display:none;fill:none;stroke-linejoin:round}
  .rainbow #shOuter{stroke:url(#gRain)} .rainbow #shInner{stroke:#fff;opacity:.6}
  .arcane #shOuter{stroke:url(#gGold);filter:drop-shadow(0 0 6px rgba(255,200,80,.6))} .arcane #shInner{stroke:var(--c2)}
  .comic #shBlack{display:block;stroke:#000} .comic #shOuter{filter:none} .comic #shInner{stroke:#000}
  .glitch #shG1,.glitch #shG2{display:block;mix-blend-mode:screen;opacity:.85}
  .glitch #shG1{stroke:#ff2a6d;transform:translate(-2px,0)} .glitch #shG2{stroke:#05d9e8;transform:translate(2px,0)}
  .glitch.pulse #shG1{animation:glitchA 2.4s steps(1) infinite} .glitch.pulse #shG2{animation:glitchB 2.4s steps(1) infinite}
  #frame.flash{animation:flash 1.4s ease-out !important}
  @keyframes flash{0%,40%{border-color:#ffe14d;box-shadow:inset 0 0 0 3px #fff, inset 0 0 60px #ffe14d}}
  #frame.frost{border-color:#bfefff !important}

  /* ---- corner runes ---- */
  .rune{position:absolute;width:calc(var(--t) * 3 + 14px);height:calc(var(--t) * 3 + 14px);z-index:4;pointer-events:none;
    transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px var(--c1))}
  .rune svg{width:100%;height:100%;animation:spin 9s linear infinite}
  .pixel .rune svg{animation:spinStep 4s steps(4) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinStep{to{transform:rotate(360deg)}}
  .rune.tl{left:calc(var(--t) / 2);top:calc(var(--t) / 2)} .rune.tr{left:calc(100% - var(--t) / 2);top:calc(var(--t) / 2)}
  .rune.bl{left:calc(var(--t) / 2);top:calc(100% - var(--t) / 2)} .rune.br{left:calc(100% - var(--t) / 2);top:calc(100% - var(--t) / 2)}
  body:not(.runes) .rune{display:none}

  /* ---- name tag ---- */
  #tag{position:absolute;z-index:5;max-width:70%;background:rgba(18,8,34,.92);border:3px solid var(--c1);
    border-radius:10px;box-shadow:4px 4px 0 var(--c2);padding:calc(6px * var(--ts)) calc(14px * var(--ts)) calc(7px * var(--ts));
    transform-origin:left bottom}
  #tag.tl{left:calc(var(--t) * 1.6);top:calc(var(--t) * 1.6)} #tag.tr{right:calc(var(--t) * 1.6);top:calc(var(--t) * 1.6)}
  #tag.bl{left:calc(var(--t) * 1.6);bottom:calc(var(--t) * 1.6)} #tag.br{right:calc(var(--t) * 1.6);bottom:calc(var(--t) * 1.6)}
  #tag.none{display:none}
  #tag .n{font:calc(24px * var(--ts))/1.1 Bungee, Impact, sans-serif;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tag .s{font:calc(21px * var(--ts))/1 VT323, monospace;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tag .s:empty{display:none}
  .pixel #tag{border-radius:0;box-shadow:4px 4px 0 #000}
  .pixel #tag .n{font:calc(16px * var(--ts))/1.4 "Press Start 2P", monospace}
  .clean #tag{border-width:2px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .clean #tag .n{font:700 calc(22px * var(--ts))/1.15 Rubik, sans-serif;text-shadow:none}
  .clean #tag .s{font:500 calc(15px * var(--ts))/1.2 Rubik, sans-serif}
  #tag.hidden{display:none}

  /* ---- alert banner + "by" label ---- */
  #banner{position:absolute;left:50%;bottom:calc(var(--t) * 2 + 8%);z-index:6;transform:translate(-50%,40px) scale(.8);opacity:0;
    text-align:center;pointer-events:none;max-width:86%}
  #banner.on{animation:bannerIn 4.2s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes bannerIn{0%{opacity:0;transform:translate(-50%,40px) scale(.6)}10%{opacity:1;transform:translate(-50%,0) scale(1.08)}
    16%{transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
  #banner .b1{font:calc(34px * var(--ts))/1.05 Bungee, Impact, sans-serif;color:#ffe14d;-webkit-text-stroke:2px #000;
    text-shadow:4px 4px 0 var(--c2), 0 0 18px rgba(255,225,77,.7)}
  #banner .b2{margin-top:6px;font:calc(26px * var(--ts))/1 VT323, monospace;color:#fff;text-shadow:2px 2px 0 #000}
  .pixel #banner .b1{font:calc(22px * var(--ts))/1.4 "Press Start 2P", monospace;-webkit-text-stroke:0;text-shadow:3px 3px 0 #000}
  #by{position:absolute;right:calc(var(--t) * 1.6);top:calc(var(--t) * 1.6);z-index:6;font:calc(22px * var(--ts))/1 VT323, monospace;
    color:#fff;background:rgba(18,8,34,.85);border:2px solid var(--c2);border-radius:8px;padding:3px 9px;opacity:0;transition:opacity .3s;pointer-events:none}
  #by.on{opacity:1}

  /* shake (preview only, OBS shakes the real camera) */
  #root.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(6px,-2px)}30%,50%,70%{transform:translate(-10px,3px)}40%,60%{transform:translate(10px,-3px)}}
</style>
</head>
<body>
<div id="root">
  <canvas id="bgcv"></canvas>
  <canvas id="fxb"></canvas>
  <canvas id="camcv"></canvas>
  <div id="frame"></div>
  <div class="rune tl"></div><div class="rune tr"></div><div class="rune bl"></div><div class="rune br"></div>
  <div id="tag" class="bl"><div class="n" id="tagName"></div><div class="s" id="tagSub"></div></div>
  <div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
  <div id="by"></div>
  <svg id="shapeSvg" aria-hidden="true"><defs>
    <linearGradient id="gRain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset=".17" stop-color="#ffb02e"/><stop offset=".33" stop-color="#ffe14d"/><stop offset=".5" stop-color="#3dff8a"/><stop offset=".67" stop-color="#2ff3ff"/><stop offset=".83" stop-color="#b14dff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4c2"/><stop offset=".25" stop-color="#d9a521"/><stop offset=".5" stop-color="#7a4d06"/><stop offset=".7" stop-color="#ffe08a"/><stop offset="1" stop-color="#a8740a"/></linearGradient>
  </defs><path id="shBlack"/><path id="shG1"/><path id="shG2"/><path id="shOuter"/><path id="shInner"/></svg>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const D = { style: "neon", c1: "#2ff3ff", c2: "#b14dff", t: 8, r: 18, glow: 18, pulse: true, runes: true,
              name: "", sub: "", tag: "bl", tsize: 100, sound: true, vol: 50, shape: "square", cam: "", mirror: false,
              bg: "none", blur: 14, paint: "none", behind: true, both: true, prop: "none", grade: "none", light: 0, avatar: "off", avCol: "purple", avSkin: "#f2c9a0", cut: 0, testCard: true, bodyFx: "none", bodyCol: "theme", bodyC1: "#2ff3ff", bodyC2: "#b14dff", bodyStr: 100, bodySize: 100, bodyPulse: 50, predict: true, obj: "", objBg: "clear", objSize: 100, objFeat: 160, objNeck: true, objNeckAmt: 100, objFollow: true, objBlend: 30, draw: false, drawCol: "rainbow", drawStyle: "neon", drawSize: 8, drawFade: 0, drawPalm: true, layer: "", host: "localhost", port: "4455", pw: "" };
  const cfg = { ...D };
  const params = new URLSearchParams(location.search);
  for (const [k, v] of params) {
    if (!(k in D)) continue;
    cfg[k] = typeof D[k] === "boolean" ? (v === "1" || v === "true") : typeof D[k] === "number" ? Number(v) : v;
  }
  if (window.__CAMCFG) Object.assign(cfg, window.__CAMCFG);
  const PREVIEW = !!window.__CAMPREVIEW;

  const RUNE = c => `<svg viewBox="-12 -12 24 24"><path d="M0-11L2.6-2.6 11 0 2.6 2.6 0 11-2.6 2.6-11 0-2.6-2.6Z" fill="${c}" stroke="#000" stroke-width="1.2"/><circle r="2" fill="#fff"/></svg>`;
  const hex = v => /^#[0-9a-f]{6}$/i.test(v || "") ? v : null;

  // name tag and banner grow/shrink with the size of the cam (sized for 960×540)
  function autoSize() {
    const auto = Math.max(.45, Math.min(1.8, Math.min(innerWidth / 960, innerHeight / 540)));
    document.body.style.setProperty("--ts", Math.max(.3, Math.min(4, auto * (Number(cfg.tsize) || 100) / 100)));
  }
  addEventListener("resize", autoSize);
  const STYLES = ["neon", "pixel", "clean", "arcane", "glitch", "rainbow", "comic", "none"];
  function apply() {
    const b = document.body;
    b.className = [STYLES.includes(cfg.style) ? cfg.style : "neon", cfg.pulse ? "pulse" : "", cfg.runes ? "runes" : "",
      "shape-" + (["square", "round", "circle", "hex", "gem", "shield", "heart", "arch"].includes(cfg.shape) ? cfg.shape : "square"),
      ["hex", "gem", "shield", "heart", "arch"].includes(cfg.shape) ? "svgshape" : ""].join(" ");
    b.style.setProperty("--c1", hex(cfg.c1) || D.c1);
    b.style.setProperty("--c2", hex(cfg.c2) || D.c2);
    b.style.setProperty("--t", Math.max(0, Math.min(60, Number(cfg.t) || 0)) + "px");
    b.style.setProperty("--r", Math.max(0, Math.min(400, Number(cfg.r) || 0)) + "px");
    b.style.setProperty("--glow", Math.max(0, Math.min(80, Number(cfg.glow) || 0)) + "px");
    autoSize();
    const runeC = cfg.style === "arcane" ? "#ffd86b" : cfg.style === "comic" ? "#ffe14d" : (hex(cfg.c2) || D.c2);
    document.querySelectorAll(".rune").forEach(r => { r.innerHTML = RUNE(runeC); });
    $("tagName").textContent = cfg.name || "";
    $("tagSub").textContent = cfg.sub || "";
    $("tag").className = (["tl", "tr", "bl", "br", "none"].includes(cfg.tag) ? cfg.tag : "bl") + (cfg.name || cfg.sub ? "" : " hidden");
    if (typeof drawShape === "function") drawShape();
  }

  // ================= sounds (made in the browser, no files) =================
  let actx = null, noiseBuf = null;
  function ac() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return actx;
  }
  function tone(f, f2, start, dur, type, gain) {
    const a = ac(), t0 = a.currentTime + .01 + start, o = a.createOscillator(), g = a.createGain();
    const v = (cfg.vol / 100) * (gain || .25);
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
  }
  function noise(start, dur, freq, type, gain, sweepTo) {
    const a = ac(), t0 = a.currentTime + .01 + start, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const v = (cfg.vol / 100) * (gain || .3);
    g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + Math.min(.2, dur / 3)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.loop = true; s.connect(f).connect(g).connect(a.destination); s.start(t0); s.stop(t0 + dur + .05);
  }
  const SOUNDS = {
    spark()    { [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, 0, i * .06, .35, "sine", .18)); },

    m.set(bytes); m[len] = 0x80;

    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) w[i] = (w[i-16] + (r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3)) + w[i-7] + (r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10))) >>> 0;
      let [a,b,c,d,e,f,g,h] = H0;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;

  async function sha(str) {

  }

    if (PREVIEW || !cfg.host) return;
    let ws;
    try { ws = new WebSocket(`ws://${cfg.host}:${cfg.port || 4455}`); } catch (e) { return setTimeout(linkObs, 5000); }
    const pong = () => { try { ws.send(JSON.stringify({ op: 6, d: { requestType: "BroadcastCustomEvent", requestId: "pong" + Date.now(), requestData: { eventData: { wizcamPong: true } } } })); } catch (e) {} };

      }

    ws.onclose = () => { if (obsWs === ws) obsWs = null; setTimeout(linkObs, 5000); };
    ws.onerror = () => {};
  }

  apply();
  linkObs();
})();
